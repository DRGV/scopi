[build-system]
requires = ["setuptools>=77"]          # 77 understands the SPDX license expression below
build-backend = "setuptools.build_meta"

[project]
name = "scopi"
version = "0.1.0"
description = "Microscope image viewing and processing for Raspberry Pi 5"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dwight Vieira" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "pillow",
    "tifffile",
    "imageio",
    "pandas",
    "matplotlib",
    "PySide6-Essentials",
]

[project.optional-dependencies]
dicom = ["pydicom"]
test = ["pytest", "pytest-qt"]

[project.scripts]
scopi = "scopi.app:main"

[project.entry-points."scopi.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
