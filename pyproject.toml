[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagepi"
version = "0.1.0"
description = "Microscope image viewing and processing for Raspberry Pi 5"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "pillow",
    "tifffile",
    "imageio",
    "pandas",
    "matplotlib",
    "PySide6-Essentials",
]

[project.optional-dependencies]
dicom = ["pydicom"]
test = ["pytest", "pytest-qt"]

[project.scripts]
imagepi = "imagepi.app:main"

[project.entry-points."imagepi.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
