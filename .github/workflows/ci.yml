name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scopi does not pin its dependencies (see requirements.txt), so run weekly to catch a new release of NumPy, Qt, OpenCV and the rest that breaks it.
    - cron: "23 5 * * 1"
  workflow_dispatch:

# The default token can only read the repository. No job here needs more.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit hash, not a tag a maintainer could move. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check (rules are in pyproject.toml)
        run: ruff check --output-format=github .
      - name: Shell scripts
        run: shellcheck --severity=warning packaging/install_pi.sh   # shellcheck is preinstalled on GitHub's Ubuntu runners

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 has the glibc 2.39 that the PySide6 wheels need (the same as Raspberry Pi OS Trixie); macos-latest is Apple silicon, the development machine.
        # Keep the Python versions in step with the classifiers in pyproject.toml (tests/test_metadata.py checks).
        os: [ubuntu-24.04, macos-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen          # the Qt tests run without a display, as on the maintainer's machines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - name: Install Scopi and the test tools
        # Editable, because tests/test_packaging.py compares the application icon's path with the source tree. The package job below checks the built wheel.
        run: python -m pip install -e ".[test]"
      - name: Versions under test
        run: python -m pip list
      - name: pytest
        run: python -m pytest -ra

  package:
    name: Build and check the package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check the metadata and the readme render
        run: python -m twine check --strict dist/*
      - name: The wheel carries the icon and the license, and no tests
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "scopi/resources/scopi.png" in names, "the application icon is missing from the wheel (package-data in pyproject.toml)"
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), "the LICENSE file is missing from the wheel"
          assert not any(n.startswith(("tests/", "scripts/", "vendor/")) for n in names), "the wheel must hold only the scopi package"
          print(f"{len(names)} files in the wheel")
          PY
